
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b70">
  <meta name="description" content="CSE Reviewer - Civil Service Examination Reviewer">
  <meta name="application-name" content="CSE Reviewer">
  <title>CSE Reviewer</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef3f9;
      color: #183153;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(22, 59, 112, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #163b70;
    }

    p {
      line-height: 1.6;
      color: #596b80;
    }

    .open-button {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 10px;
      background: #163b70;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .open-button:hover {
      background: #24528e;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>CSE Reviewer</h1>

    <p>
      Your personal Civil Service Examination study space.
      Open the reviewer to access your study materials,
      practice quizzes, mock exams, vocabulary, and progress.
    </p>

    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbw0wAJob-tbYyLYIuEhH1IdBc2Rjw_bxQ9hgAzHhFXbe4kK57QJ_POHQgJERuOSpAh9/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open CSE Reviewer
    </a>

    <p class="note">
      If the reviewer does not open, check your Google Apps Script
      deployment and access permissions.
    </p>
  </main>
</body>
</html>
