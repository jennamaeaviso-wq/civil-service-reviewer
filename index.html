
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b70">
  <meta name="description" content="Civil Service Reviewer">
  <title>Civil Service Reviewer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #eef3f9;
    }
    #reviewer {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: white;
    }
    #error {
      display: none;
      padding: 24px;
      text-align: center;
      color: #183153;
    }
  </style>
</head>
<body>
  <iframe
    id="reviewer"
    title="Civil Service Reviewer"
    src="https://script.google.com/macros/s/AKfycbw0wAJob-tbYyLYIuEhH1IdBc2Rjw_bxQ9hgAzHhFXbe4kK57QJ_POHQgJERuOSpAh9/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <div id="error">
    <h2>Reviewer could not load</h2>
    <p>Google Apps Script may not allow embedding this app yet.</p>
    <a href="https://script.google.com/macros/s/AKfycbw0wAJob-tbYyLYIuEhH1IdBc2Rjw_bxQ9hgAzHhFXbe4kK57QJ_POHQgJERuOSpAh9/exec">
      Open Reviewer directly
    </a>
  </div>

  <script>
    const frame = document.getElementById("reviewer");
    frame.addEventListener("error", () => {
      frame.style.display = "none";
      document.getElementById("error").style.display = "block";
    });
  </script>
</body>
</html>
