
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b70">
  <meta name="description" content="Civil Service Reviewer">
  <title>Civil Service Reviewer</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef3f9;
      color: #183153;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      padding: 32px 24px;
    }

    img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    p {
      color: #58677b;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #163b70;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="Civil Service Reviewer">
    <h2>Opening Civil Service Reviewer...</h2>
    <p>Please wait while the reviewer loads.</p>
    <a id="open" href="https://script.google.com/macros/s/AKfycbw0wAJob-tbYyLYIuEhH1IdBc2Rjw_bxQ9hgAzHhFXbe4kK57QJ_POHQgJERuOSpAh9/exec">
      Open Reviewer
    </a>
  </main>

  <script>
    const reviewerURL =
      "https://script.google.com/macros/s/AKfycbw0wAJob-tbYyLYIuEhH1IdBc2Rjw_bxQ9hgAzHhFXbe4kK57QJ_POHQgJERuOSpAh9/exec";

    document.getElementById("open").href = reviewerURL;

    window.location.replace(reviewerURL);
  </script>
</body>
</html>
